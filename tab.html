<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab — Noxa Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-tab">
  <main class="tab-page">
    <div class="tab-strip" id="tabStrip"></div>

    <header class="webview-topbar" id="webviewTopbar">
      <button class="webview-btn" id="tabHome" title="Beranda">🏠 <span>Home</span></button>
      <button class="webview-btn" id="tabBack" title="Kembali">⬅️ <span>Back</span></button>
      <button class="webview-btn" id="newTab" title="Tab baru">＋ <span>Tab Baru</span></button>
      <input id="webviewUrl" class="webview-input" placeholder="Masukkan URL...">
      <button class="webview-btn" id="goUrl" title="Buka URL">↵ <span>Buka</span></button>
      <button class="webview-btn" id="copyUrl" title="Salin URL">📋 <span>Salin</span></button>
      <button class="webview-btn" id="externalUrl" title="Buka di luar">↗️ <span>Luar</span></button>
    </header>

    <section class="tab-content" id="newTabView">
      <div class="new-tab-logo"><span>N</span><span>o</span><span>x</span><span>a</span> <span>Browser</span></div>
      <p class="new-tab-subtitle">Tab baru</p>
      <form id="newTabForm" class="search-container" autocomplete="off">
        <div class="search-box-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input id="newTabInput" class="search-box" placeholder="Cari atau masukkan URL...">
        </div>
      </form>
    </section>

    <iframe id="mainFrame" class="webview-frame" title="Halaman web" hidden></iframe>
  </main>

  <script src="js/common.js"></script>
  <script src="js/tab.js"></script>
</body>
</html>
